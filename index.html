<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vladimir Leicht — Information Technology Specialist - Systems Integration</title>
  <meta name="description" content="Portfolio of Vladimir Leicht, Information Technology Specialist - Systems Integration. Final project, private IT projects and CV." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>.pre-intro .head{opacity:0;visibility:hidden}</style>
  <script>
    (() => {
      const hash = location.hash.replace(/^#/, '').trim();
      const reduced = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
      if (!reduced && (!hash || hash === 'home')) document.documentElement.classList.add('pre-intro');
    })();
  </script>
</head>
<body>
  <div class="frame" id="frame">
    <div class="frame__edge frame__edge--tl"></div>
    <div class="frame__edge frame__edge--tr"></div>
    <div class="frame__edge frame__edge--bl"></div>
    <div class="frame__edge frame__edge--br"></div>

    <header class="head">
      <a class="head__brand" href="#" data-target="home">
        <svg class="head__sigil" viewBox="0 0 34 34" aria-hidden="true" focusable="false">
          <rect class="sigil__outer" x="0.5" y="0.5" width="33" height="33" />
          <rect class="sigil__mid" x="7.5" y="7.5" width="19" height="19" />
          <rect class="sigil__core" x="13.6" y="13.6" width="6.8" height="6.8" />
        </svg>
        <span class="head__name">Vladimir Leicht</span>
        <span class="head__role" data-i18n="brand.role">Information Technology Specialist - Systems Integration</span>
      </a>

      <nav class="nav" id="nav">
        <div class="nav__group">
          <button class="nav__link" data-target="abschluss" data-i18n="nav.finalProject">Final Project</button>
          <div class="nav__sub">
            <button data-target="abschluss/server">Server</button>
            <button data-target="abschluss/uem">UEM</button>
            <button data-target="abschluss/clients">Clients</button>
            <button data-target="abschluss/migration">Migration</button>
          </div>
        </div>

        <div class="nav__group">
          <button class="nav__link" data-target="projekte" data-i18n="nav.privateProjects">Private IT Projects</button>
          <div class="nav__sub">
            <button data-target="projekte/homelab">Homelab</button>
            <button data-target="projekte/automation" data-i18n="nav.automation">Automation</button>
            <button data-target="projekte/web">Web</button>
          </div>
        </div>

        <div class="nav__group">
          <button class="nav__link" data-target="lebenslauf" data-i18n="nav.cv">CV</button>
          <div class="nav__sub">
            <button data-target="lebenslauf/bildungsweg" data-i18n="nav.education">Education</button>
            <button data-target="lebenslauf/faehigkeiten" data-i18n="nav.skills">Skills</button>
            <button data-target="lebenslauf/kontakt" data-i18n="nav.contact">Contact</button>
          </div>
        </div>

        <button class="nav__link" id="language-switch" type="button" aria-label="Switch to German" title="Switch to German">DE</button>
      </nav>
    </header>

    <main class="stage" id="stage">
      <canvas id="scene"></canvas>

      <div class="boot" id="boot">
        <div class="boot__ring"></div>
        <span class="boot__text" data-i18n="boot.initialising">Initialising</span>
      </div>
    </main>

    <footer class="foot">
      <button class="foot__hint" id="hint" type="button" data-i18n="footer.chooseArea" data-distort-label="Choose section">Choose section</button>
      <span class="foot__crumb" id="crumb">Home</span>
    </footer>
  </div>

  <noscript>
    <div class="noscript">
      This site uses WebGL. Please enable JavaScript.
    </div>
  </noscript>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
